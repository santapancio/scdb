detalle:

estado:

etiquetas:

sub-iniciativas:

#----------------------------------------------------------------------------------------------------------------------------detalle
# Cualquier cosa relevante, literalmente cualquiera
# Frecuentemente usado para describir la iniciativa
#
# detalle: "texto ejemplo"
#----------------------------------------------------------------------------------------------------------------------------estado
# El estado actual de la iniciativa
# FORMATO ESTRICTO - sólo puede tener un (singular) estado posible de los siguientes:
# "propuesto" (lo pensamos y lo queremos hacer, pero todavía no sabemos si lo vamos a hacer)
# "lista de espera" (lo vamos a hacer próximamente)
# "en desarrollo"
# "pausado"
# "abandonado" (no se completó y no se está completando)
# "completado: operando"
# "completado: no operando"
# "completado: descontinuado" (se completó y operó, pero ya no lo vamos a operar)
# "completado" (para cosas que se hacen una vez, por ejemplo)
# "no aplica"
#
# estado:
#   - "texto en lista ejemplo 1"
#   - "texto en lista ejemplo 2"
#----------------------------------------------------------------------------------------------------------------------------etiquetas
# Describen la naturaleza de la iniciativa. No necesitan muchísima precisión, son para hacer más fácil la administración
# FORMATO ESTRICTO - sólo puede tener una (o más) etiquetas:
# "software"
# "producto físico" (incluyendo hardware informático)
# "servicio"
# "infraestructura"
# "investigación"
# "información"
# "contenido"
# "actividad"
# "trabajo creativo"
# "inversión"
# "operación conjunta" (dirigido por múltiples personas / entidades, SC participa)
# "otro" (especificar)
#
# etiquetas:
#   - "texto en lista ejemplo 1"
#   - "texto en lista ejemplo 2"
#----------------------------------------------------------------------------------------------------------------------------sub-iniciativas
# Sub-iniciativas que pertenecen a esta iniciativa
# Cada item debe contener referencia a la sub-iniciativa en cuestión
# Se suele [[referenciar]] en este campo
#
# sub-iniciativas:
#   - "texto en lista ejemplo 1, o bien [[referencia-de-ejemplo 1]]"
#   - "texto en lista ejemplo 2, o bien [[referencia-de-ejemplo 2]]"
#----------------------------------------------------------------------------------------------------------------------------etc
# Si un campo está vacío, debe dejarse como "nombre-de-campo:" y nada más, como se ve en esta plantilla
# El resto de la información sobre el funcionamiento de las delegaciones en SCDB se encuentra en su respectiva guía
# Estos renglones de comentario (que empiezan con "#") recomendamos eliminarlos del contenido de los elementos
