detalle: >
  campaña semanal de variedad de Barotrauma, complementaria a la campaña principal seria y de estilo militar [[campana-barotrauma-seria]]
  hosteada, administrada y coordinada por Trusty mediante la delegación [[organizador-campana-barotrauma-variedad]]
  compromiso: todos los sábados desde el 7 de noviembre de 2026 inclusive hasta el 20 de febrero de 2027 inclusive, de 18:00 a 21:00 hora de Buenos Aires
  el delegado puede anunciar la campaña en otras comunidades, hacerla pública en el explorador de servidores y reclutar al servidor de Discord de SC a participantes civilizados

