#----------------------------------------------------------------------------------------------------------------------------responsabilidades
# Responsabilidades de esta delegación
#
# responsabilidades:
#   - "texto en lista ejemplo 1"
#   - "texto en lista ejemplo 2"
#----------------------------------------------------------------------------------------------------------------------------especificaciones
# Instrucciones, métodos, principios y recomendaciones sobre cómo llevar a cabo las responsabilidades
#
# especificaciones:
#   - "texto en lista ejemplo 1"
#   - "texto en lista ejemplo 2"
#----------------------------------------------------------------------------------------------------------------------------detalle
# Cualquier cosa relevante, literalmente cualquiera
#
# detalle: "texto ejemplo"
#----------------------------------------------------------------------------------------------------------------------------trabajo-asignado
# Lista recursos de tipo "trabajo" en el sistema de recursos que hayan sido asignados a esta delegación
# El primer elemento de la lista retiene autoridad final
# Se suelen [[referenciar]] cosas en este campo
#
# trabajo-asignado:
#   - "texto en lista ejemplo 1, o bien [[referencia-de-ejemplo 1]]"
#   - "texto en lista ejemplo 2, o bien [[referencia-de-ejemplo 2]]"
#----------------------------------------------------------------------------------------------------------------------------subdelegaciones
# Subdelegaciones que pertenecen a esta delegación
# Cada item debe contener referencia a la subdelegación en cuestión
# Se suelen [[referenciar]] cosas en este campo
#
# subdelegaciones:
#   - "texto en lista ejemplo 1, o bien [[referencia-de-ejemplo 1]]"
#   - "texto en lista ejemplo 2, o bien [[referencia-de-ejemplo 2]]"
#----------------------------------------------------------------------------------------------------------------------------etc
# Si un campo está vacío, debe dejarse como "nombre-de-campo:" y nada más, como se ve en esta plantilla
# El resto de la información sobre el funcionamiento de las delegaciones en SCDB se encuentra en su respectiva guía
# Estos renglones de comentario (que empiezan con "#") no son necesarios, pero recomendamos que queden, para poder guiarse
