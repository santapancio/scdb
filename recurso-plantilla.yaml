detalle:

estado:

propiedad:

control:

operacion-asignacion:

etiquetas:

#----------------------------------------------------------------------------------------------------------------------------detalle
# Cualquier cosa relevante, literalmente cualquiera
# Frecuentemente usado para describir el recurso o sus condiciones de uso
#
# detalle: "texto ejemplo"
#----------------------------------------------------------------------------------------------------------------------------estado
# El estado actual del recurso
# FORMATO ESTRICTO - sólo puede tener un (singular) estado posible de los siguientes:
# "disponible"
# "ocupado" (cuando está siendo usado y no puede usarse en simultáneo para otra cosa)
# "no disponible"
# "condicional"
# "no aplica"
#
# estado: "texto ejemplo"
#----------------------------------------------------------------------------------------------------------------------------propiedad
# Describe quién es el dueño establecido de este recurso
#
# propiedad: "texto ejemplo"
#----------------------------------------------------------------------------------------------------------------------------control
# Describe quién tiene el control práctico sobre el recurso. Por ejemplo, acceso o custodia física
#
# control: "texto ejemplo"
#----------------------------------------------------------------------------------------------------------------------------operacion-asignacion
# El contenido describe quién o qué decide qué ocurre con este recurso, o cuál es el uso que se le está dando en caso de no haberlo
# Este campo no establece autoridad sobre un recurso por su cuenta - toda autoridad es definida por el sistema de delegaciones, que decide cómo la autoridad se relaciona con este campo
# Se suele [[referenciar]] en este campo
#
# operacion-asignacion: "texto ejemplo"
#----------------------------------------------------------------------------------------------------------------------------etiquetas
# Describen la naturaleza del recurso. No necesitan muchísima precisión, son para hacer más fácil la administración
# FORMATO ESTRICTO - sólo puede tener una (o más) etiquetas de las siguientes:
# "dinero"
# "software"
# "producto físico (incluye hardware informático)"
# "servicio"
# "infraestructura (espacio de almacenamiento digital, capacidad de cómputo, de red van acá)"
# "trabajo"
# "información"
# "conocimiento / experiencia"
# "asesoramiento"
# "contenido"
# "espacio físico"
# "trabajo creativo"
# "materiales / insumos"
# "acceso"
# "licencia / derechos de uso"
# "otro"
#
# etiquetas:
#   - "texto en lista ejemplo 1"
#   - "texto en lista ejemplo 2"
#----------------------------------------------------------------------------------------------------------------------------etc
# Si un campo está vacío, debe dejarse como "nombre-de-campo:" y nada más, como se ve en esta plantilla
# El resto de la información sobre el funcionamiento de los recursos en SCDB se encuentra en su respectiva guía
# Estos renglones de comentario (que empiezan con "#") recomendamos eliminarlos del contenido de los elementos
