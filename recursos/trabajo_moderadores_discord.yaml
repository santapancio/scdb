# detalle:
# Cualquier cosa relevante, literalmente cualquiera
#
# (FORMATO ESTRICTO) estado:
# Describe el estado actual del recurso
# Lista de estados posibles
#    - disponible
#    - no disponible
#    - condicional
#    - no aplica
#    - indeterminado
#
# propiedad:
# Describe quién es el dueño establecido de este recurso
#
# control:
# Describe quién tiene el control práctico sobre el recurso. Por ejemplo, acceso / custodia física
#
# operacion-asignacion:
# El contenido describe, cuando se le da autoridad a este campo, quién decide qué ocurre con este recurso
# Este campo no establece autoridad sobre un recurso por su cuenta - toda autoridad es definida por el sistema de delegaciones, que decide cómo la autoridad se relaciona con este campo
#
# (FORMATO ESTRICTO) etiquetas:
# Describen la naturaleza del recurso. No necesitan muchísima precisión, son para hacer más fácil la administración
# Lista de etiquetas
#    - dinero
#    - software
#    - producto físico (incluye hardware informático)
#    - servicio
#    - infraestructura (espacio de almacenamiento digital, capacidad de cómputo, de red van acá)
#    - trabajo
#    - información
#    - conocimiento / experiencia
#    - asesoramiento
#    - contenido
#    - espacio físico
#    - trabajo creativo
#    - materiales / insumos
#    - acceso
#    - licencia / derechos de uso
#    - otro: (especificar)
#
# Estos renglones de comentario (que empiezan con "#") no son necesarios, pero recomendamos que queden, para poder guiarse
