responsabilidades:
  - "organizar, hostear y administrar la campaña semanal de variedad de Barotrauma [[campana-barotrauma-variedad]]"
  - "mantener la continuidad y coordinación de la campaña durante el período acordado"
  - "reclutar al servidor de Discord de SC a participantes que demuestren ser buena gente y manejarse civilizadamente"

especificaciones:
  - "compromiso: todos los sábados desde el 7 de noviembre de 2026 inclusive hasta el 20 de febrero de 2027 inclusive, de 18:00 a 21:00 hora de Buenos Aires"
  - "derecho de escritura en #hosting-anuncios en cualquier momento, siempre que no sea un ping; se recomienda no saturar el canal con mensajes"
  - "derecho de pingear partida casual al comenzar partidas los sábados dentro del horario acordado"
  - "libertad de anunciar la campaña en otras comunidades y de hacerla pública en el explorador de servidores"

detalle: >
  delegado encargado de [[campana-barotrauma-variedad]]
  subdelegación directa de [[administrador-general-sc]]
  campaña semanal de variedad
  delegación temporal para el período acordado
  privilegios
  - derecho de escritura a #hosting-anuncios

