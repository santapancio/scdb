responsabilidades:
  - "mantener el mínimo de decencia en el servidor de discord comunitario"
  - "moderación a discreción -> no se requiere justificación legal para tomar acciones de moderación - si se lo ve adecuado, se tiene permitido hacerlo haciéndose responsable de la decisión que tomó. No toleraremos el abuso de autoridad"
  - "no usar sus privilegios de moderación que puedan ofender, molestar o irritar a otros sin justificación, ni siquiera a modo de chiste (es por algo)"

especificaciones:
  - "no se requiere un compromiso de tiempo o vigilancia constante si no se desea, pero al estar activo en el servidor y presenciar directamente algo que requiere moderación, se deben tomar las medidas de moderación correspondientes y resolver la cuestión permanentemente de ser posible"
  - "la moderación se hace con criterio propio y de buena fe; no se espera que consultes antes de tomar medidas de moderación ordinarias"
  - "las medidas deben ser proporcionales a lo necesario para mantener el orden - ni más, ni menos"

detalle: >
  moderador para [[servidor-discord-comunitario]]
  esto está pensado como un rol para dar a varias personas que van a estar ocupadas como todos, de manera que siempre haya alguien para moderar al nivel más básico, y por eso tiene pocos privilegios y no es requerido que se haga activamente sino más bien pasivamente
  - privilegios
    - rol de moderador en servidor de discord ("M")
      - privilegios de moderación
      - acceso a #mod

personas-asignadas:
  - "[[trabajo_moderadores_discord]]"

subdelegaciones:
  - ""

# responsabilidades:
